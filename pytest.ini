[pytest]
pythonpath = src tests
testpaths = tests
# Sem isto, o pytest coletaria as funcoes testar_* importadas dos modulos
# como se fossem casos de teste.
python_functions = test_*
markers =
    postgres: integracao com PostgreSQL; pulado quando DATABASE_URL nao esta definida.
filterwarnings =
    ignore::DeprecationWarning:dateutil.*
